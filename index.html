<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleidoscope</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        #controls button {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 3px;
        }

        #controls button:hover {
            background-color: #444;
        }

        #controls label {
            color: #fff;
            font-family: sans-serif;
            margin-right: 10px;
        }

        #controls input[type="range"] {
            -webkit-appearance: none;
            width: 150px;
            height: 8px;
            background: #555;
            outline: none;
            opacity: 0.7;
            transition: opacity .2s;
            border-radius: 4px;
        }

        #controls input[type="range"]:hover {
            opacity: 1;
        }

        #controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #aaa;
            cursor: pointer;
        }

        #controls input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #aaa;
            cursor: pointer;
        }
    </style>
  <script type="module" crossorigin src="/kaleidoscope/assets/index-DTXZ62d7.js"></script>
</head>
<body>
    <canvas id="kaleidoscopeCanvas"></canvas>
    <div id="controls">
        <button id="colorButton">Change Colors</button>
        <div>
            <label for="rotationSpeed">Rotation Speed:</label>
            <input type="range" id="rotationSpeed" min="-0.01" max="0.01" value="0.0" step="0.0001">
        </div>
    </div>
</body>
</html>
