<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaleidoscope</title>
    <link rel="icon" href="/kaleidoscope/assets/favicon-Dv2HI8Jl.ico">
    <style>
        :root {
            --bg-glass: rgba(122, 122, 122, 0.5);
            --border-glass: rgba(255, 255, 255, 0.2);
            --text-color: #eee;
            --accent-color: #fff;
            --transition-speed: 0.3s;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        canvas {
            display: block;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 220px;

            /* Hidden by default */
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px) scale(0.95);
            transition:
                opacity var(--transition-speed),
                transform var(--transition-speed),
                visibility var(--transition-speed);
        }

        #controls.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #controls label {
            color: var(--text-color);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
            opacity: 0.8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .value-indicator {
            font-family: monospace;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        #controls button {
            background-color: var(--accent-color);
            color: #111;
            border: none;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all var(--transition-speed);
            margin-bottom: 8px;
        }

        #controls button:hover {
            background-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }

        #controls button:active {
            transform: translateY(0);
        }

        #controls input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: var(--border-glass);
            outline: none;
            border-radius: 2px;
        }

        #controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: 2px solid rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        #controls input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #controls input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: 2px solid rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
    </style>
  <script type="module" crossorigin src="/kaleidoscope/assets/index-DM3g_r35.js"></script>
</head>

<body>
    <canvas id="kaleidoscopeCanvas"></canvas>
    <div id="controls">
        <button id="resetButton"
            style="background-color: var(--border-glass); color: var(--text-color); margin-bottom: 12px; font-size: 0.8rem; padding: 8px;">Reset
            to Defaults</button>
        <button id="colorButton">Randomize Colors</button>

        <div class="control-group">
            <label for="rotationSpeed">
                Internal Spin
                <span id="rotationSpeedValue" class="value-indicator">0</span>
            </label>
            <input type="range" id="rotationSpeed" min="-0.01" max="0.01" value="0.0" step="0.0001">
        </div>

        <div class="control-group">
            <label for="globalRotationSpeed">
                Pattern Spin
                <span id="globalRotationSpeedValue" class="value-indicator">0</span>
            </label>
            <input type="range" id="globalRotationSpeed" min="-0.01" max="0.01" value="0.0" step="0.0001">
        </div>

        <div class="control-group">
            <label for="colorSpeed">
                Color Shift
                <span id="colorSpeedValue" class="value-indicator">0</span>
            </label>
            <input type="range" id="colorSpeed" min="0" max="2" value="0.2" step="0.01">
        </div>

        <div class="control-group">
            <label for="zoom">
                Zoom
                <span id="zoomValue" class="value-indicator">1.00x</span>
            </label>
            <input type="range" id="zoom" min="0.5" max="3" value="1.0" step="0.01">
        </div>

        <div class="control-group">
            <label for="fullness">
                Fullness
                <span id="fullnessValue" class="value-indicator">1.00</span>
            </label>
            <input type="range" id="fullness" min="0.1" max="1.0" value="0.3" step="0.01">
        </div>

        <div class="control-group">
            <label for="particleSize">
                Particle Size
                <span id="particleSizeValue" class="value-indicator">1.00x</span>
            </label>
            <input type="range" id="particleSize" min="0.5" max="2.0" value="1.2" step="0.01">
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border-glass); margin: 8px 0;">

        <div class="control-group">
            <button id="bgRandomButton" style="width: 100%; margin: 0;">Randomize Background</button>
        </div>

        <div class="control-group">
            <label for="bgLightness">
                BG Lightness
                <span id="bgLightnessValue" class="value-indicator">7%</span>
            </label>
            <input type="range" id="bgLightness" min="0" max="100" value="7" step="1">
        </div>

        <div class="control-group" style="flex-direction: row; justify-content: space-between; align-items: center;">
            <label for="bgLoop" style="margin: 0; cursor: pointer;">Loop Background</label>
            <input type="checkbox" id="bgLoop"
                style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-color);">
        </div>
    </div>
</body>

</html>
